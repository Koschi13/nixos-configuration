[project]
name = "firefly-importer-ing"
version = "0.1.0"
description = "Convert ING exports and import them into Firefly III"
requires-python = ">=3.12"
# The Nix build takes these from nixpkgs (see default.nix); `uv run` installs
# them from PyPI for local development.
dependencies = [
    "alembic",
    "cryptography",
    "flask>=3",
    "flask-wtf",
    "gunicorn",
    "itsdangerous",
    "psycopg>=3",
    "requests",
    "sqlalchemy>=2",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
ing-to-firefly = "firefly_importer_ing.cli:main"
firefly-importer-ing-serve = "firefly_importer_ing:serve"
firefly-importer-ing-migrate = "firefly_importer_ing:migrate"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firefly_importer_ing"]
# Generated by the Tailwind CLI before the build, see default.nix
artifacts = ["src/firefly_importer_ing/static/app.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

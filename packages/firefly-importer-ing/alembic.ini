# Only for development, to create a migration after changing `models.py`:
#
#     DATABASE_URL=postgresql+psycopg:///… alembic revision --autogenerate -m "…"
#
# The service itself migrates with `firefly-importer-ing-migrate`, which
# doesn't read this file.
[alembic]
script_location = src/firefly_importer_ing/migrations
file_template = %%(rev)s_%%(slug)s
